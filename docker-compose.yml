version: '3.9'

services:
  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: shopify-audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditiq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-auditiq}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-auditiq}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: shopify-audit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # API server
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: shopify-audit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-auditiq}:${POSTGRES_PASSWORD:-auditiq_secret}@postgres:5432/${POSTGRES_DB:-auditiq}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 4000
      NODE_ENV: production
    ports:
      - '4000:4000'
    volumes:
      - /tmp:/tmp

  # Next.js frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shopify-audit-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000}
      NODE_ENV: production
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
